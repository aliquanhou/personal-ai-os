name: Test

on:
  push:
    branches: [master, sprint-*]
  pull_request:
    branches: [master]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest tests/test_kernel.py tests/test_memory.py tests/test_tools.py tests/test_agent_runtime.py -v

  scenario-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy httpx pydantic python-dotenv typer

      - name: Run scenario tests
        run: |
          python -m pytest tests/scenarios/ -v

  api-health:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy httpx pydantic python-dotenv typer aiosqlite

      - name: Create test .env
        run: |
          cp .env.example .env
          echo "DEEPSEEK_API_KEY=ci-test-key" >> .env
          echo "PORT=8001" >> .env

      - name: Start server & health check
        run: |
          cd $GITHUB_WORKSPACE
          python main.py serve --host 127.0.0.1 --port 8001 --no-reload &
          sleep 5
          curl -s http://127.0.0.1:8001/health | grep '"status":"ok"'
          curl -s http://127.0.0.1:8001/api/agents | grep '"ceo"'
          curl -s http://127.0.0.1:8001/api/org/registry | grep '"Agent\|agents"'
          curl -s http://127.0.0.1:8001/api/comm/status | grep '"agents"'
          echo "✅ API health check passed"

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check . --ignore E501,E402,F401
